# Set default shell.
set-option -g default-shell /opt/homebrew/bin/fish

# Change prefix key to CTRL+a.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Remove delay from escape key.
set -s escape-time 0

# Enable mouse.
set -g mouse on

# (MacOS only) Copy selected text to the clipboard.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Disable auto window renaming.
set-option -g allow-rename off

# Start window number from 1.
set -g base-index 1
setw -g pane-base-index 1

# Start new window in current path.
bind c new-window -c "#{pane_current_path}"

# Set new binds to split pane.
bind | split-window -h -c "#{pane_current_path}" \; set pane-active-border-style fg=#444444 \; set pane-border-style fg=#444444 \;
bind - split-window -v -c "#{pane_current_path}" \; set pane-active-border-style fg=#444444 \; set pane-border-style fg=#444444 \;
unbind "'"
unbind %

# Add keybind to (re)source the tmux config file.
bind R source-file ~/.tmux.conf

# Enable VIM keybindings.
setw -g mode-keys vi

# (MacOS only) Copy text to the clipboard.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

## Status Bar
# Move it to top.
set-option -g status-position top

# Change its color to orange.
set -g status-style bg=colour214,fg=black
set -g window-status-current-style bg=colour214,fg=black

# Change right status text to only display current time.
# set -g status-right "#(TZ='Europe/Dublin' date +%%H:%M)"

# Hide right status text.
set -g status-right ""

# Enable 256-color Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager.
run '~/.tmux/plugins/tpm/tpm'
